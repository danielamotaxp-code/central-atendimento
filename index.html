<style>
:root{--bg:#f3f4f1;--surface:#fff;--line:#d6d9d1;--fg:#1d221c;--muted:#5e665b;--accent:#b4570a;--warn:#a1330f}
@media (prefers-color-scheme:dark){:root{--bg:#141713;--surface:#1d211c;--line:#343a32;--fg:#e8ebe4;--muted:#9aa395;--accent:#f0954a;--warn:#ff9a7a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font:700 1.5rem "Bricolage Grotesque","Trebuchet MS",sans-serif}
p{margin:0;color:var(--muted);font-size:.9rem}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
input{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:1rem}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.7;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--warn);font-weight:600}
[hidden]{display:none!important}
</style>

const te=new TextEncoder();
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=u=>btoa(String.fromCharCode(...u));
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
async function abrir(chave){
  const k=await crypto.subtle.importKey("raw",chave,"AES-GCM",false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb(P.iv)},k,unb(P.dados)));
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const b=document.getElementById("b"),e=document.getElementById("e");
  b.disabled=true;b.textContent="Verificando…";e.hidden=true;
  try{
    const login=document.getElementById("u").value;
    const h=await crypto.subtle.digest("SHA-256",te.encode("central-atendimento:"+norm(login)));
    const a=P.acessos[[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")];
    if(!a)throw 0;
    const base=await crypto.subtle.importKey("raw",te.encode(document.getElementById("s").value),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:unb(a.salt),iterations:P.iter},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const chave=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb(a.iv)},k,unb(a.chave)));
    ss.set("ca-chave",b64(chave));ss.set("ca-pacote",P.id);ss.set("ca-user",login.trim());
    await abrir(chave);
  }catch(err){e.hidden=false;e.textContent="Login ou senha incorretos.";b.disabled=false;b.textContent="Entrar"}
});
(async()=>{
  const c=ss.get("ca-chave");
  if(c&&ss.get("ca-pacote")===P.id){try{await abrir(unb(c));return}catch(e){}}
  ss.del("ca-chave");ss.del("ca-pacote");
  document.getElementById("f").hidden=false;document.getElementById("u").focus();
})();
})();
</script>
