<!DOCTYPE html>
<html lang="pt-BR">
<head>

<body>
  <div id="plataforma"></div>
  <script src="kit/plataforma.js?v=5"></script>
  <script>
  /* Portal único: um login e um menu com todas as páginas.
     Cada página continua no próprio repositório; aqui só fica o acesso. */
  (function () {
    var R = 'danielamotaxp-code/';
    Plataforma.iniciar({
      id: 'plataforma',
      nome: 'Plataforma',
      subtitulo: 'WeGen · SmartBen · WattWise',
      letra: 'P',
      cor: '#3b4a5c',
      versao: '5',
      repoSite: R + 'central-atendimento',
      cofre: 'cofre.json',
      repoDados: R + 'central-atendimento-dados',
      usuariosIniciais: ['Daniela', 'Paula', 'Luis', 'Victor'],
      admins: ['Daniela'],
      marcasLogin: ['wegen', 'smartben', 'wattwise'],
      limparAoSair: ['cd.sessao', 'aud.sessao', 'ouv_sessao', 'ouv_tok', 'ww_token', 'ww_nome'],
      modulos: [
        { id: 'atendimento', nome: 'Central de Atendimento', descricao: 'Mensagens padronizadas para os clientes', marcas: ['wegen', 'smartben', 'wattwise'],
          src: '/central-atendimento/atendimento/', repos: [R + 'central-atendimento-dados'], usuarios: ['Daniela', 'Paula', 'Luis', 'Victor'] },
        { id: 'cobranca', nome: 'Cobrança Inadimplentes', descricao: 'Mensagens de cobrança, planilhas e gateway', marcas: ['smartben', 'wegen', 'wattwise'],
          src: '/cobranca-inadimplentes/app.html', repos: [R + 'cobranca-inadimplentes', R + 'cobranca-acessos'], usuarios: ['Daniela', 'Luis', 'Paula', 'Laura', 'Guilherme', 'Victor'] },
        { id: 'faturas', nome: 'Faturas e Contratos', descricao: 'Conferência semanal de faturas e contratos', marcas: ['wattwise'],
          src: '/faturas-contratos/app.html', repos: [R + 'faturas-contratos', R + 'faturas-contratos-acessos'], usuarios: ['Daniela', 'Paula', 'Ytala'] },
        { id: 'ouvidorias', nome: 'Ouvidorias Cemig', descricao: 'Gerar, enviar e registrar ouvidorias', marcas: ['wattwise'],
          src: '/ouvidorias-cemig/app.html', repos: [R + 'ouvidorias-cemig-dados'], usuarios: ['Daniela', 'Paula', 'Pedro', 'Victor', 'Ytala'] },
        { id: 'distratos', nome: 'Central de Distratos', descricao: 'Termos de distrato a partir do D4Sign', marcas: ['wegen', 'smartben'],
          src: '/central-distratos/app.html', repos: [R + 'central-distratos', R + 'central-distratos-dados'], usuarios: ['Daniela', 'Paula'] },
        { id: 'auditoria', nome: 'Auditoria de Injeção', descricao: 'Injeção e consumo por instalação', marcas: ['wegen', 'smartben'],
          src: '/auditoria-injecao/app.html', repos: [R + 'auditoria-dados'], usuarios: ['Daniela', 'Laura', 'Paula', 'Luis', 'Guilherme'] }
      ]
    });
  })();
